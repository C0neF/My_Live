name: Windows desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main, V3]
    paths:
      - 'desktop/**'
      - 'live-core/**'
      - 'shared-model/**'
      - 'shared-ui/**'
      - 'app/src/main/assets/scripts/**'
      - 'app/src/main/res/drawable-nodpi/ic_launcher_foreground_art.png'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/windows.yml'
  push:
    branches: [main, V3, 'codex/**']
    paths:
      - 'desktop/**'
      - 'live-core/**'
      - 'shared-model/**'
      - 'shared-ui/**'
      - 'app/src/main/assets/scripts/**'
      - 'app/src/main/res/drawable-nodpi/ic_launcher_foreground_art.png'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # Hosted runners only expose Microsoft OpenGL 1.1. The native smoke test needs a real WGL
    # driver, so the Mesa llvmpipe opengl32.dll below is placed where both Skiko and mpv load it.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: desktop/launcher/global.json
      - name: Install Mesa llvmpipe OpenGL
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'mesa'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $archive = Join-Path $dest 'mesa.7z'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/25.2.5/mesa3d-25.2.5-release-msvc.7z'
          $expected = '24b082cd3b66115a7ddb355e69fa0332dd22c751a392ab61ea3f5c9f6c912b88'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "Mesa SHA-256 mismatch: $hash" }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$dest" x64/opengl32.dll x64/libgallium_wgl.dll x64/dxil.dll -y
          $bin = Join-Path $dest 'x64'
          if (-not (Test-Path (Join-Path $bin 'opengl32.dll'))) { throw 'Mesa opengl32.dll was not extracted' }
          Copy-Item "$bin\*.dll" -Destination "$env:JAVA_HOME\bin" -Force
          "MYLIVE_MESA_BIN=$bin" >> $env:GITHUB_ENV
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
      - name: Read Windows version
        shell: pwsh
        run: |
          $version = ((Get-Content desktop/version.properties | Where-Object { $_ -match '^version=' }) -replace '^version=','').Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Windows version' }
          "WINDOWS_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test shared core and desktop
        run: .\gradlew.bat --no-daemon :desktop:verifyWindows
      - name: Package Windows app, single EXE and installers
        run: .\gradlew.bat --no-daemon :desktop:packageWindows :desktop:singleFileTest
      - name: Check installer path budget
        shell: pwsh
        run: ./desktop/release/Test-PackagePaths.ps1 -ImageDirectory desktop/build/compose/binaries/main/app/MyLive
      - name: Check Windows Installer argument handling
        shell: pwsh
        run: ./desktop/release/Test-InstallerArguments.ps1
      - name: Install, upgrade, reject downgrade and uninstall
        shell: pwsh
        run: |
          ./desktop/release/Verify-Installer.ps1 `
            -Msi "desktop/build/compose/binaries/main/msi/MyLive-$env:WINDOWS_VERSION.msi" `
            -SetupExe "desktop/build/compose/binaries/main/exe/MyLive-$env:WINDOWS_VERSION.exe" `
            -Media desktop/src/test/resources/sample.flv `
            -ReportDirectory build/windows-installer-check -ExpectedVersion $env:WINDOWS_VERSION `
            -ExpectedApplicationJarSha256 (Get-FileHash desktop/build/libs/desktop.jar -Algorithm SHA256).Hash `
            -ExpectedNativeSourceLockSha256 (Get-FileHash desktop/native-notices/sources.lock.json -Algorithm SHA256).Hash
      - name: Collect pinned native sources
        shell: pwsh
        run: |
          ./desktop/release/Collect-NativeSources.ps1 `
            -CacheDirectory build/native-sources `
            -OutputFile "build/MyLive-Native-Sources-$env:WINDOWS_VERSION.zip"
      - name: Assemble release candidate and checksums
        shell: pwsh
        run: |
          ./desktop/release/New-ReleaseBundle.ps1 -OutputDirectory build/windows-release `
            -InstallerReceipt build/windows-installer-check/installer-verification.json `
            -NativeSources "build/MyLive-Native-Sources-$env:WINDOWS_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MyLive-Windows-x64-${{ env.WINDOWS_VERSION }}
          path: build/windows-release/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-test-reports
          path: |
            desktop/build/reports/tests/
            live-core/build/reports/tests/
            desktop/build/reports/ui-evidence/
            build/windows-installer-check/
            desktop/build/reports/single-file/
